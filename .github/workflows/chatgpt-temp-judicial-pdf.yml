name: ChatGPT Temp Judicial PDF
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  selected:
    strategy:
      fail-fast: false
      matrix:
        no: [765,764,763,762,761,760,759,758,757,756]
    runs-on: ubuntu-latest
    steps:
      - name: Download and select official PDFs
        shell: bash
        run: |
          set -euo pipefail
          NO='${{ matrix.no }}'
          DOCID=$((310181 + NO))
          mkdir -p selected
          curl -L --fail --retry 10 --retry-delay 4 --connect-timeout 30 -A 'Mozilla/5.0' \
            "https://cons.judicial.gov.tw/Ajax/docdownload.aspx?fid=100&id=${DOCID}" \
            -o package.zip
          python - "$NO" <<'PY'
          import sys, zipfile, os, shutil
          no=sys.argv[1]
          with zipfile.ZipFile('package.zip') as z:
              keep=[]
              for n in z.namelist():
                  base=os.path.basename(n)
                  is_main = base == f'釋字第{no}號.pdf'
                  is_justice_opinion = ('大法官' in base and '意見書' in base and base.lower().endswith('.pdf'))
                  if is_main or is_justice_opinion:
                      keep.append(n)
              if not any(os.path.basename(n)==f'釋字第{no}號.pdf' for n in keep):
                  raise SystemExit(f'missing main PDF for {no}')
              for n in keep:
                  base=os.path.basename(n)
                  with z.open(n) as src, open(os.path.join('selected',base),'wb') as dst:
                      shutil.copyfileobj(src,dst)
              print(f'{no}: selected {len(keep)} files')
              for n in keep: print('  ',os.path.basename(n))
          PY
          for f in selected/*.pdf; do test "$(head -c 4 "$f")" = '%PDF'; done
      - name: Upload selected PDFs
        uses: actions/upload-artifact@v4
        with:
          name: judicial-${{ matrix.no }}-selected
          path: selected/*.pdf
          if-no-files-found: error
          compression-level: 0
